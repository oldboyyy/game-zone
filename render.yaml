# Free educational deployment: API + ephemeral Redis on Render, PostgreSQL on Neon.
services:
  - type: web
    name: game-zone-api
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/oldboyyy/game-zone
    branch: main
    rootDir: src/server
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:deploy
    healthCheckPath: /health/detailed
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.23.5
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CLIENT_URL_PROD
        sync: false
      - key: REDIS_URL
        fromService:
          name: game-zone-redis
          type: keyvalue
          property: connectionString
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
  - type: keyvalue
    name: game-zone-redis
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction
