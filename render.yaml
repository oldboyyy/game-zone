# Free educational deployment: API + ephemeral Redis on Render, PostgreSQL on Neon.
services:
  - type: web
    name: game-zone-api
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/oldboyyy/game-zone
    branch: main
    buildCommand: cd src/server && npm ci --include=dev && npx prisma generate && npm run build && cd ../client && npm ci --include=dev && npm run build
    startCommand: npm --prefix src/server run start:deploy
    healthCheckPath: /health/detailed
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.23.5
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SERVE_FRONTEND
        value: "true"
      - key: NEXT_PUBLIC_API_URL_PROD
        value: /api/v1
      - key: NEXT_PUBLIC_SOCKET_URL
        value: /
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
      - key: NEXT_PUBLIC_USE_DEMO_CATALOG
        value: "false"
      - key: REDIS_URL
        fromService:
          name: game-zone-redis
          type: keyvalue
          property: connectionString
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
  - type: keyvalue
    name: game-zone-redis
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction
